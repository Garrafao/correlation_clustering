
[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools']

[project]
name='correlation_clustering'
version='2.0.0'
description='A python implementation of Correlation Clustering'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
    'networkx>=3',
    'numpy>=2',
    'scipy>=1.15',
]
keywords = [
    'Clustering',
    'Correlation Clustering',
    'Graph Theory',
    'Mathematics',
    'network',
    'graph',
    'discrete mathematics',
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development :: Libraries :: Python Modules'
]

authors = [
  {name = "Dominik Schlechtweg", email = "dominik.schlechtweg@ims.uni-stuttgart.de"}
]

[project.urls]
"Bug Tracker" = 'https://github.com/Garrafao/correlation_clustering/issues'
"Source Code" = 'https://github.com/Garrafao/correlation_clustering'
